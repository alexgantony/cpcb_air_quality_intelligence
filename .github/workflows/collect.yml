name: Collect Real time Air Quality Index

on:
  schedule:
    - cron: '*/15 * * * *' # every 15 minutes

  # Manually trigger the workflow from the GitHub actions tab
  workflow_dispatch:

permissions:
  contents: write # lets the workflow push the new file

concurrency:
  group: collect # never run two collections at once
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Run Collector
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: uv run src/collect.py

      - name: Commit and push latest data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/api
          git diff --staged --quiet && exit 0
          git commit -m "data: CPCB snapshot $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
